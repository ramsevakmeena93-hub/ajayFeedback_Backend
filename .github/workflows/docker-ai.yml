name: Build & Push AI Model Docker Image

on:
  push:
    branches: [ master, main ]
    paths:
      - 'huggingface_space/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push AI model image
        uses: docker/build-push-action@v5
        with:
          context: ./huggingface_space
          file: ./huggingface_space/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/feedback-ai:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/feedback-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
